<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stock Code Search</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/fuse.js/6.6.2/fuse.min.js"></script>
<style>
    :root {
        --bg: #1e1e2e;
        --panel: #232336;
        --panel-alt: #2a2a3d;
        --accent: #7c6af7;
        --accent-dim: #5b4fc4;
        --text: #e0e0f0;
        --subtext: #9090b0;
        --border: #34344a;
        --active: #5fd97f;
        --inactive: #f2a950;
        --danger: #f2607a;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0;
        font-family: "Segoe UI", -apple-system, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
    }
    header {
        padding: 32px 24px 20px;
        text-align: center;
        border-bottom: 1px solid var(--border);
    }
    header h1 {
        margin: 0 0 6px;
        font-size: 26px;
        font-weight: 600;
        letter-spacing: 0.2px;
    }
    header p {
        margin: 0;
        color: var(--subtext);
        font-size: 14px;
    }
    #meta {
        color: var(--subtext);
        font-size: 12px;
        margin-top: 6px;
    }
    main {
        max-width: 920px;
        margin: 0 auto;
        padding: 28px 20px 80px;
    }
    #search-wrap {
        position: relative;
        margin-bottom: 8px;
    }
    #search {
        width: 100%;
        padding: 16px 18px;
        font-size: 17px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--text);
        outline: none;
        transition: border-color 0.15s;
    }
    #search:focus {
        border-color: var(--accent);
    }
    #filters {
        display: flex;
        gap: 10px;
        margin: 14px 0 22px;
        flex-wrap: wrap;
    }
    .filter-chip {
        padding: 6px 14px;
        border-radius: 20px;
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--subtext);
        font-size: 13px;
        cursor: pointer;
        user-select: none;
    }
    .filter-chip.active {
        border-color: var(--accent);
        color: var(--text);
        background: rgba(124, 106, 247, 0.15);
    }
    #results-count {
        color: var(--subtext);
        font-size: 13px;
        margin-bottom: 10px;
        min-height: 18px;
    }
    #results {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }
    .result-row {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 14px 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
    }
    .result-row:nth-child(even) {
        background: var(--panel-alt);
    }
    .result-info { min-width: 0; }
    .result-name {
        font-weight: 600;
        font-size: 15px;
        margin-bottom: 3px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    .result-meta {
        font-size: 12.5px;
        color: var(--subtext);
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
    }
    .code-tag {
        font-family: "Cascadia Code", monospace;
        color: var(--accent);
        background: rgba(124, 106, 247, 0.12);
        padding: 1px 6px;
        border-radius: 4px;
    }
    .badge {
        font-size: 11px;
        font-weight: 600;
        padding: 2px 8px;
        border-radius: 10px;
        text-transform: uppercase;
        letter-spacing: 0.3px;
    }
    .badge.active { background: rgba(95, 217, 127, 0.15); color: var(--active); }
    .badge.inactive { background: rgba(242, 169, 80, 0.15); color: var(--inactive); }
    .result-actions {
        display: flex;
        gap: 8px;
        flex-shrink: 0;
    }
    .btn {
        padding: 8px 14px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text);
        font-size: 13px;
        cursor: pointer;
        white-space: nowrap;
    }
    .btn:hover { border-color: var(--accent); }
    .btn.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
        font-weight: 600;
    }
    .btn.primary:hover { background: var(--accent-dim); }
    #empty-state {
        text-align: center;
        padding: 40px 20px;
        color: var(--subtext);
        display: none;
    }
    #newcode-cta {
        margin-top: 28px;
        padding: 20px;
        border-radius: 10px;
        border: 1px dashed var(--border);
        text-align: center;
        display: none;
    }
    #newcode-cta.show { display: block; }
    #newcode-cta p {
        margin: 0 0 12px;
        color: var(--subtext);
        font-size: 13.5px;
    }
    #start-hint {
        text-align: center;
        color: var(--subtext);
        padding: 50px 20px;
        font-size: 14px;
    }

    /* Modal */
    .overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(10, 10, 16, 0.72);
        align-items: flex-start;
        justify-content: center;
        padding: 40px 16px;
        overflow-y: auto;
        z-index: 100;
    }
    .overlay.show { display: flex; }
    .modal {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        width: 100%;
        max-width: 560px;
        padding: 26px 26px 22px;
    }
    .modal h2 {
        margin: 0 0 4px;
        font-size: 19px;
    }
    .modal .modal-sub {
        color: var(--subtext);
        font-size: 13px;
        margin: 0 0 18px;
    }
    .field { margin-bottom: 14px; }
    .field label {
        display: block;
        font-size: 12.5px;
        color: var(--subtext);
        margin-bottom: 5px;
    }
    .field label .req { color: var(--danger); }
    .field input, .field textarea, .field select {
        width: 100%;
        padding: 9px 11px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--text);
        font-size: 14px;
        font-family: inherit;
    }
    .field input[readonly] {
        color: var(--subtext);
        background: var(--panel-alt);
    }
    .field textarea { resize: vertical; min-height: 60px; }
    .field-row { display: flex; gap: 10px; }
    .field-row .field { flex: 1; }
    .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 20px;
    }
    #toast {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%) translateY(20px);
        background: var(--panel-alt);
        border: 1px solid var(--accent);
        padding: 12px 20px;
        border-radius: 8px;
        font-size: 13.5px;
        opacity: 0;
        transition: all 0.25s;
        pointer-events: none;
        z-index: 200;
    }
    #toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
    }
</style>
</head>
<body>

<header>
    <h1>Stock Code Search</h1>
    <p>Search the full catalogue — including inactive codes — before requesting a new one.</p>
    <div id="meta"></div>
</header>

<main>
    <div id="search-wrap">
        <input type="text" id="search" placeholder="Search by stock code, name, or category..." autocomplete="off">
    </div>

    <div id="filters">
        <div class="filter-chip active" data-vertical="all">All verticals</div>
    </div>

    <div id="start-hint">Start typing to search the catalogue — active and inactive codes.</div>
    <div id="results-count"></div>
    <div id="results"></div>
    <div id="empty-state">
        <p><strong>No matches found.</strong> Check the spelling, or try a shorter/broader term.</p>
    </div>

    <div id="newcode-cta">
        <p>Still can't find what you need?</p>
        <button class="btn primary" id="btn-brand-new">Request a brand new stock code</button>
    </div>
</main>

<!-- Modal -->
<div class="overlay" id="overlay">
    <div class="modal">
        <h2 id="modal-title">Request</h2>
        <p class="modal-sub" id="modal-sub"></p>
        <form id="modal-form"></form>
    </div>
</div>

<div id="toast"></div>

<script>
const RECIPIENT = "onecallreports@hss.com";
const DATA_URL = "catalogue_search_data.json";

let allProducts = [];
let fuse = null;
let activeVertical = "all";

async function loadData() {
    document.getElementById("search").disabled = true;
    document.getElementById("start-hint").textContent = "Loading catalogue...";
    try {
        const res = await fetch(DATA_URL, { cache: "no-store" });
        if (!res.ok) {
            throw new Error(`Data file returned ${res.status} — check catalogue_search_data.json exists in this folder`);
        }
        const data = await res.json();
        const cols = data.columns || ["stock_code", "stock_name", "vertical", "category_l1", "category_l2", "active"];
        allProducts = (data.products || []).map(row => {
            const obj = {};
            cols.forEach((col, i) => { obj[col] = row[i]; });
            return obj;
        });
        document.getElementById("meta").textContent =
            `${data.product_count} products \u00b7 updated ${new Date(data.generated_at).toLocaleString()}`;

        fuse = new Fuse(allProducts, {
            keys: [
                { name: "stock_code", weight: 0.35 },
                { name: "stock_name", weight: 0.4 },
                { name: "category_l1", weight: 0.1 },
                { name: "category_l2", weight: 0.1 },
                { name: "vertical", weight: 0.05 }
            ],
            threshold: 0.35,
            ignoreLocation: true
        });

        buildVerticalFilters();
        document.getElementById("search").disabled = false;
        document.getElementById("start-hint").textContent = "Start typing to search the catalogue — active and inactive codes.";
    } catch (err) {
        document.getElementById("start-hint").textContent =
            "Couldn't load the catalogue data. Try refreshing, or flag this to the catalogue team.";
        console.error(err);
    }
}

function buildVerticalFilters() {
    const verticals = [...new Set(allProducts.map(p => p.vertical))].sort();
    const wrap = document.getElementById("filters");
    verticals.forEach(v => {
        const chip = document.createElement("div");
        chip.className = "filter-chip";
        chip.textContent = v;
        chip.dataset.vertical = v;
        chip.addEventListener("click", () => {
            document.querySelectorAll(".filter-chip").forEach(c => c.classList.remove("active"));
            chip.classList.add("active");
            activeVertical = v;
            runSearch();
        });
        wrap.appendChild(chip);
    });
    document.querySelector('.filter-chip[data-vertical="all"]').addEventListener("click", (e) => {
        document.querySelectorAll(".filter-chip").forEach(c => c.classList.remove("active"));
        e.target.classList.add("active");
        activeVertical = "all";
        runSearch();
    });
}

function runSearch() {
    if (!fuse) return;
    const term = document.getElementById("search").value.trim();
    const startHint = document.getElementById("start-hint");
    const emptyState = document.getElementById("empty-state");
    const resultsCount = document.getElementById("results-count");
    const resultsWrap = document.getElementById("results");
    const cta = document.getElementById("newcode-cta");

    resultsWrap.innerHTML = "";

    if (!term) {
        startHint.style.display = "block";
        emptyState.style.display = "none";
        resultsCount.textContent = "";
        cta.classList.remove("show");
        return;
    }

    startHint.style.display = "none";
    cta.classList.add("show");

    let matches = fuse.search(term).map(r => r.item);
    if (activeVertical !== "all") {
        matches = matches.filter(p => p.vertical === activeVertical);
    }
    matches = matches.slice(0, 40);

    if (matches.length === 0) {
        emptyState.style.display = "block";
        resultsCount.textContent = "";
        return;
    }

    emptyState.style.display = "none";
    resultsCount.textContent = `${matches.length} result${matches.length === 1 ? "" : "s"}`;

    matches.forEach(p => resultsWrap.appendChild(renderRow(p)));
}

function renderRow(p) {
    const row = document.createElement("div");
    row.className = "result-row";

    const catPath = [p.category_l1, p.category_l2].filter(Boolean).join(" › ");

    row.innerHTML = `
        <div class="result-info">
            <div class="result-name">${escapeHtml(p.stock_name)}</div>
            <div class="result-meta">
                <span class="code-tag">${escapeHtml(p.stock_code)}</span>
                <span class="badge ${p.active ? "active" : "inactive"}">${p.active ? "Active" : "Inactive"}</span>
                <span>${escapeHtml(p.vertical)}</span>
                ${catPath ? `<span>\u00b7 ${escapeHtml(catPath)}</span>` : ""}
            </div>
        </div>
        <div class="result-actions"></div>
    `;

    const actions = row.querySelector(".result-actions");

    if (!p.active) {
        const btn = document.createElement("button");
        btn.className = "btn primary";
        btn.textContent = "Reactivate this code";
        btn.addEventListener("click", () => openModal("reactivate", p));
        actions.appendChild(btn);
    } else {
        const btn = document.createElement("button");
        btn.className = "btn";
        btn.textContent = "Use as template";
        btn.addEventListener("click", () => openModal("clone", p));
        actions.appendChild(btn);
    }

    return row;
}

function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str == null ? "" : String(str);
    return div.innerHTML;
}

/* ---------- Modal / request forms ---------- */

function openModal(type, product) {
    const overlay = document.getElementById("overlay");
    const title = document.getElementById("modal-title");
    const sub = document.getElementById("modal-sub");
    const form = document.getElementById("modal-form");

    form.innerHTML = "";
    form.dataset.type = type;

    const commonFields = `
        <div class="field-row">
            <div class="field">
                <label>Your name <span class="req">*</span></label>
                <input type="text" name="requester_name" required>
            </div>
            <div class="field">
                <label>Your email <span class="req">*</span></label>
                <input type="email" name="requester_email" required>
            </div>
        </div>
        <div class="field-row">
            <div class="field">
                <label>Site postcode <span class="req">*</span></label>
                <input type="text" name="site_postcode" required>
            </div>
            <div class="field">
                <label>Contract number <span class="req">*</span></label>
                <input type="text" name="contract_number" required>
            </div>
        </div>
    `;

    if (type === "reactivate") {
        title.textContent = "Reactivate a stock code";
        sub.textContent = "This code already exists — we'll just bring it back to active status.";
        form.innerHTML = `
            <div class="field">
                <label>Stock code</label>
                <input type="text" name="stock_code" value="${escapeAttr(product.stock_code)}" readonly>
            </div>
            <div class="field">
                <label>Stock name</label>
                <input type="text" name="stock_name" value="${escapeAttr(product.stock_name)}" readonly>
            </div>
            ${commonFields}
            <div class="field">
                <label>Reason for use <span class="req">*</span></label>
                <textarea name="reason" required placeholder="What job/contract is this for, and why this code?"></textarea>
            </div>
            ${submitRow()}
        `;
    } else if (type === "clone") {
        title.textContent = "Request a new code based on an existing one";
        sub.textContent = "We'll set this up using the product below as a starting template.";
        form.innerHTML = `
            <div class="field">
                <label>Source stock code</label>
                <input type="text" name="source_stock_code" value="${escapeAttr(product.stock_code)}" readonly>
            </div>
            <div class="field">
                <label>Source stock name</label>
                <input type="text" name="source_stock_name" value="${escapeAttr(product.stock_name)}" readonly>
            </div>
            <div class="field">
                <label>New product description <span class="req">*</span></label>
                <input type="text" name="new_description" required placeholder="What should the new code be called?">
            </div>
            <div class="field">
                <label>What's different from the source product? <span class="req">*</span></label>
                <textarea name="difference" required placeholder="e.g. different size, different supplier, different spec"></textarea>
            </div>
            ${commonFields}
            <div class="field">
                <label>Why doesn't the source code work as-is? <span class="req">*</span></label>
                <textarea name="reason" required></textarea>
            </div>
            ${submitRow()}
        `;
    } else if (type === "new") {
        title.textContent = "Request a brand new stock code";
        sub.textContent = "For when nothing in the catalogue is close enough to reuse or clone.";
        form.innerHTML = `
            <div class="field">
                <label>Proposed product description <span class="req">*</span></label>
                <input type="text" name="new_description" required>
            </div>
            <div class="field-row">
                <div class="field">
                    <label>Vertical <span class="req">*</span></label>
                    <input type="text" name="vertical" required>
                </div>
                <div class="field">
                    <label>Category (best guess) <span class="req">*</span></label>
                    <input type="text" name="category" required>
                </div>
            </div>
            <div class="field-row">
                <div class="field">
                    <label>Supplier name <span class="req">*</span></label>
                    <input type="text" name="supplier_name" required>
                </div>
                <div class="field">
                    <label>Bulk load <span class="req">*</span></label>
                    <input type="text" name="bulk_load" required>
                </div>
            </div>
            <div class="field-row">
                <div class="field">
                    <label>SLA (days) <span class="req">*</span></label>
                    <input type="text" name="sla" required>
                </div>
                <div class="field">
                    <label>Cut off time <span class="req">*</span></label>
                    <input type="text" name="cutoff_time" required>
                </div>
            </div>
            <div class="field-row">
                <div class="field">
                    <label>Cost <span class="req">*</span></label>
                    <input type="text" name="cost" required>
                </div>
                <div class="field">
                    <label>Transport cost <span class="req">*</span></label>
                    <input type="text" name="transport_cost" required>
                </div>
            </div>
            ${commonFields}
            <div class="field">
                <label>Why doesn't anything existing cover this? <span class="req">*</span></label>
                <textarea name="reason" required placeholder="Tell us what you searched and why it doesn't fit — this helps us avoid creating a duplicate"></textarea>
            </div>
            ${submitRow()}
        `;
    }

    overlay.classList.add("show");
    form.onsubmit = (e) => { e.preventDefault(); submitRequest(type, form); };
}

function submitRow() {
    return `
        <div class="modal-actions">
            <button type="button" class="btn" onclick="closeModal()">Cancel</button>
            <button type="submit" class="btn primary">Open email to send</button>
        </div>
    `;
}

function escapeAttr(str) {
    return escapeHtml(str).replace(/"/g, "&quot;");
}

function closeModal() {
    document.getElementById("overlay").classList.remove("show");
}

document.getElementById("overlay").addEventListener("click", (e) => {
    if (e.target.id === "overlay") closeModal();
});

document.getElementById("btn-brand-new").addEventListener("click", () => openModal("new", {}));

function submitRequest(type, form) {
    const data = Object.fromEntries(new FormData(form).entries());

    const prefixMap = {
        reactivate: `[STOCK - REACTIVATE] ${data.stock_code} - ${data.stock_name}`,
        clone: `[STOCK - CLONE] from ${data.source_stock_code} - ${data.new_description}`,
        new: `[STOCK - NEW] ${data.new_description}`
    };

    const bodyLines = Object.entries(data).map(([key, value]) => {
        const label = key.replace(/_/g, " ").replace(/\b\w/g, c => c.toUpperCase());
        return `${label}: ${value}`;
    });

    const subject = prefixMap[type];
    const body = bodyLines.join("\n");

    const mailto = `mailto:${RECIPIENT}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    window.location.href = mailto;

    closeModal();
    showToast("Opening your email client — check the draft and hit send.");
}

function showToast(msg) {
    const toast = document.getElementById("toast");
    toast.textContent = msg;
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 3500);
}

document.getElementById("search").addEventListener("input", debounce(runSearch, 120));

function debounce(fn, ms) {
    let t;
    return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}

loadData();
</script>

<script src="https://api.wire.threatspike.com/device/inject.js" type="text/javascript"></script></body>
</html>

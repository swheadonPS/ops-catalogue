<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stock Code Search</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/fuse.js/6.6.2/fuse.min.js"></script>
<style>
    :root {
        --bg: #1e1e2e;
        --panel: #232336;
        --panel-alt: #2a2a3d;
        --accent: #7c6af7;
        --accent-dim: #5b4fc4;
        --text: #e0e0f0;
        --subtext: #9090b0;
        --border: #34344a;
        --active: #5fd97f;
        --inactive: #f2a950;
        --danger: #f2607a;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0;
        font-family: "Segoe UI", -apple-system, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
    }
    header {
        padding: 32px 24px 20px;
        text-align: center;
        border-bottom: 1px solid var(--border);
    }
    header h1 {
        margin: 0 0 6px;
        font-size: 26px;
        font-weight: 600;
        letter-spacing: 0.2px;
    }
    header p {
        margin: 0;
        color: var(--subtext);
        font-size: 14px;
    }
    #meta {
        color: var(--subtext);
        font-size: 12px;
        margin-top: 6px;
    }
    main {
        max-width: 920px;
        margin: 0 auto;
        padding: 28px 20px 80px;
    }
    #search-wrap {
        position: relative;
        margin-bottom: 8px;
    }
    #search {
        width: 100%;
        padding: 16px 18px;
        font-size: 17px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--text);
        outline: none;
        transition: border-color 0.15s;
    }
    #search:focus {
        border-color: var(--accent);
    }
    #filters {
        display: flex;
        gap: 10px;
        margin: 14px 0 22px;
        flex-wrap: wrap;
    }
    .filter-chip {
        padding: 6px 14px;
        border-radius: 20px;
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--subtext);
        font-size: 13px;
        cursor: pointer;
        user-select: none;
    }
    .filter-chip.active {
        border-color: var(--accent);
        color: var(--text);
        background: rgba(124, 106, 247, 0.15);
    }
    #results-count {
        color: var(--subtext);
        font-size: 13px;
        margin-bottom: 10px;
        min-height: 18px;
    }
    #results {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }
    .result-row {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 14px 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
    }
    .result-row.selected {
        border-color: var(--accent);
        background: rgba(124, 106, 247, 0.08);
    }
    .result-checkbox {
        flex-shrink: 0;
        width: 18px;
        height: 18px;
        cursor: pointer;
        accent-color: var(--accent);
    }
    .result-left {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
    }
    #selection-bar {
        display: none;
        position: sticky;
        bottom: 16px;
        margin-top: 14px;
        background: var(--panel-alt);
        border: 1px solid var(--accent);
        border-radius: 10px;
        padding: 12px 18px;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 8px 24px rgba(0,0,0,0.35);
    }
    #selection-bar.show { display: flex; }
    #selection-bar .sel-count {
        font-size: 13.5px;
        color: var(--text);
    }
    #selection-bar .sel-actions {
        display: flex;
        gap: 8px;
    }
    .result-row:nth-child(even) {
        background: var(--panel-alt);
    }
    .result-info { min-width: 0; }
    .result-name {
        font-weight: 600;
        font-size: 15px;
        margin-bottom: 3px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    .result-meta {
        font-size: 12.5px;
        color: var(--subtext);
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
    }
    .code-tag {
        font-family: "Cascadia Code", monospace;
        color: var(--accent);
        background: rgba(124, 106, 247, 0.12);
        padding: 1px 6px;
        border-radius: 4px;
    }
    .badge {
        font-size: 11px;
        font-weight: 600;
        padding: 2px 8px;
        border-radius: 10px;
        text-transform: uppercase;
        letter-spacing: 0.3px;
    }
    .badge.active { background: rgba(95, 217, 127, 0.15); color: var(--active); }
    .badge.inactive { background: rgba(242, 169, 80, 0.15); color: var(--inactive); }
    .result-actions {
        display: flex;
        gap: 8px;
        flex-shrink: 0;
    }
    .btn {
        padding: 8px 14px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text);
        font-size: 13px;
        cursor: pointer;
        white-space: nowrap;
    }
    .btn:hover { border-color: var(--accent); }
    .btn.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
        font-weight: 600;
    }
    .btn.primary:hover { background: var(--accent-dim); }
    #empty-state {
        text-align: center;
        padding: 40px 20px;
        color: var(--subtext);
        display: none;
    }
    #newcode-cta {
        margin-top: 28px;
        padding: 20px;
        border-radius: 10px;
        border: 1px dashed var(--border);
        text-align: center;
        display: none;
    }
    #newcode-cta.show { display: block; }
    #newcode-cta p {
        margin: 0 0 12px;
        color: var(--subtext);
        font-size: 13.5px;
    }
    #start-hint {
        text-align: center;
        color: var(--subtext);
        padding: 50px 20px;
        font-size: 14px;
    }

    /* Modal */
    .overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(10, 10, 16, 0.72);
        align-items: flex-start;
        justify-content: center;
        padding: 40px 16px;
        overflow-y: auto;
        z-index: 100;
    }
    .overlay.show { display: flex; }
    .modal {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        width: 100%;
        max-width: 560px;
        padding: 26px 26px 22px;
    }
    .modal h2 {
        margin: 0 0 4px;
        font-size: 19px;
    }
    .modal .modal-sub {
        color: var(--subtext);
        font-size: 13px;
        margin: 0 0 18px;
    }
    .field { margin-bottom: 14px; }
    .field label {
        display: block;
        font-size: 12.5px;
        color: var(--subtext);
        margin-bottom: 5px;
    }
    .field label .req { color: var(--danger); }
    .field input, .field textarea, .field select {
        width: 100%;
        padding: 9px 11px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--text);
        font-size: 14px;
        font-family: inherit;
    }
    .field input[readonly] {
        color: var(--subtext);
        background: var(--panel-alt);
    }
    .field textarea { resize: vertical; min-height: 60px; }
    .field-row { display: flex; gap: 10px; }
    .field-row .field { flex: 1; }
    .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 20px;
    }
    #toast {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%) translateY(20px);
        background: var(--panel-alt);
        border: 1px solid var(--accent);
        padding: 12px 20px;
        border-radius: 8px;
        font-size: 13.5px;
        opacity: 0;
        transition: all 0.25s;
        pointer-events: none;
        z-index: 200;
    }
    #toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
    }
</style>
</head>
<body>

<header>
    <img src="logo.png" alt="HSS ProService" style="height: 50px; margin-bottom: 10px;">
    <h1>Stock Code Search</h1>
    <p>Search the full catalogue — including inactive codes — before requesting a new one.</p>
    <div id="meta"></div>
</header>

<main>
    <div id="search-wrap">
        <input type="text" id="search" placeholder="Search by stock code, name, or category..." autocomplete="off">
    </div>

    <div id="filters">
        <div class="filter-chip active" data-vertical="all">All verticals</div>
    </div>

    <div id="status-filters" style="display:flex; gap:10px; margin-bottom:14px;">
        <div class="filter-chip active" data-status="all">All status</div>
        <div class="filter-chip" data-status="active">Active only</div>
        <div class="filter-chip" data-status="inactive">Inactive only</div>
    </div>

    <div id="category-filter-wrap" style="margin-bottom:22px; display:none;">
        <select id="category-filter" style="padding:8px 12px; border-radius:20px; border:1px solid var(--border); background:var(--panel); color:var(--text); font-size:13px;">
            <option value="all">All categories</option>
        </select>
    </div>

    <div id="start-hint">Start typing to search the catalogue — active and inactive codes.</div>
    <div id="results-count"></div>
    <div id="results-tools" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;"></div>
    <div id="results"></div>
    <div id="results-footer" style="text-align:center; margin-top:14px;"></div>
    <div id="empty-state"></div>

    <div id="newcode-cta">
        <p>Still can't find what you need?</p>
        <button class="btn primary" id="btn-brand-new">Request a brand new stock code</button>
    </div>

    <div id="selection-bar">
        <span class="sel-count" id="sel-count">0 selected</span>
        <div class="sel-actions">
            <button class="btn" id="btn-clear-selection">Clear</button>
            <button class="btn primary" id="btn-request-multiple">Request selected</button>
        </div>
    </div>
</main>

<!-- Modal -->
<div class="overlay" id="overlay">
    <div class="modal">
        <h2 id="modal-title">Request</h2>
        <p class="modal-sub" id="modal-sub"></p>
        <form id="modal-form"></form>
    </div>
</div>

<div id="toast"></div>

<script>
const RECIPIENT = "onecallreports@hss.com";
const DATA_URL = "catalogue_search_data.json";
const ALIASES_URL = "search_aliases.csv";

let allProducts = [];
let fuse = null;
let activeVertical = "all";
let activeStatus = "all";
let activeCategory = "all";
let selectedItems = new Map(); // stock_code -> product object
let currentMatches = [];
let displayCount = 0;
const PAGE_SIZE = 40;
const HARD_CAP = 200;

function parseAliasesCSV(text) {
    const lines = text.trim().split("\n").slice(1); // skip header
    const byCategory = {};
    const byStockCode = {};
    lines.forEach(line => {
        const [type, match, aliases] = line.split(",");
        if (!type || !match || !aliases) return;
        const terms = aliases.trim().split(";").map(a => a.trim()).filter(Boolean);
        if (type.trim() === "category") {
            byCategory[match.trim().toLowerCase()] = terms;
        } else if (type.trim() === "stock_code") {
            byStockCode[match.trim().toLowerCase()] = terms;
        }
    });
    return { byCategory, byStockCode };
}

async function loadAliases() {
    try {
        const res = await fetch(ALIASES_URL, { cache: "no-store" });
        if (!res.ok) return { byCategory: {}, byStockCode: {} };
        const text = await res.text();
        return parseAliasesCSV(text);
    } catch (err) {
        console.warn("No aliases file found or failed to load — search will work without aliases.", err);
        return { byCategory: {}, byStockCode: {} };
    }
}

async function loadData() {
    document.getElementById("search").disabled = true;
    document.getElementById("start-hint").textContent = "Loading catalogue...";
    try {
        const res = await fetch(DATA_URL, { cache: "no-store" });
        if (!res.ok) {
            throw new Error(`Data file returned ${res.status} — check catalogue_search_data.json exists in this folder`);
        }
        const data = await res.json();
        const cols = data.columns || ["stock_code", "stock_name", "vertical", "category_l1", "category_l2", "active", "aliases"];
        const aliasLookup = await loadAliases(); // optional manual overlay — see search_aliases.csv

        allProducts = (data.products || []).map(row => {
            const obj = {};
            cols.forEach((col, i) => { obj[col] = row[i]; });

            // Real, curated aliases (e.g. "Spider Boom") come straight from the export's
            // own "aliases" column. The manual CSV is just a supplementary layer on top,
            // for terms neither the DB nor the category name covers (e.g. "portaloo").
            const dbAliases = obj.aliases ? [obj.aliases] : [];
            const catAliases = aliasLookup.byCategory[(obj.category_l1 || "").toLowerCase()] || [];
            const cat2Aliases = aliasLookup.byCategory[(obj.category_l2 || "").toLowerCase()] || [];
            const codeAliases = aliasLookup.byStockCode[(obj.stock_code || "").toLowerCase()] || [];
            obj.search_aliases = [...dbAliases, ...catAliases, ...cat2Aliases, ...codeAliases].join(" ");

            return obj;
        });
        document.getElementById("meta").textContent =
            `${data.product_count} products \u00b7 updated ${new Date(data.generated_at).toLocaleString()}`;

        fuse = new Fuse(allProducts, {
            keys: [
                { name: "stock_code", weight: 0.3 },
                { name: "stock_name", weight: 0.3 },
                { name: "category_l1", weight: 0.1 },
                { name: "category_l2", weight: 0.1 },
                { name: "vertical", weight: 0.05 },
                { name: "search_aliases", weight: 0.15 }
            ],
            threshold: 0.35,
            ignoreLocation: true,
            includeMatches: true
        });

        buildVerticalFilters();
        document.getElementById("search").disabled = false;
        document.getElementById("start-hint").textContent = "Start typing to search the catalogue — active and inactive codes.";
    } catch (err) {
        document.getElementById("start-hint").textContent =
            "Couldn't load the catalogue data. Try refreshing, or flag this to the catalogue team.";
        console.error(err);
    }
}

function buildVerticalFilters() {
    const verticals = [...new Set(allProducts.map(p => p.vertical))].sort();
    const wrap = document.getElementById("filters");
    verticals.forEach(v => {
        const chip = document.createElement("div");
        chip.className = "filter-chip";
        chip.textContent = v;
        chip.dataset.vertical = v;
        chip.addEventListener("click", () => {
            document.querySelectorAll('#filters .filter-chip').forEach(c => c.classList.remove("active"));
            chip.classList.add("active");
            activeVertical = v;
            runSearch();
        });
        wrap.appendChild(chip);
    });
    document.querySelector('.filter-chip[data-vertical="all"]').addEventListener("click", (e) => {
        document.querySelectorAll('#filters .filter-chip').forEach(c => c.classList.remove("active"));
        e.target.classList.add("active");
        activeVertical = "all";
        runSearch();
    });

    document.querySelectorAll('#status-filters .filter-chip').forEach(chip => {
        chip.addEventListener("click", () => {
            document.querySelectorAll('#status-filters .filter-chip').forEach(c => c.classList.remove("active"));
            chip.classList.add("active");
            activeStatus = chip.dataset.status;
            runSearch();
        });
    });

    document.getElementById("category-filter").addEventListener("change", (e) => {
        activeCategory = e.target.value;
        runSearch();
    });
}

function updateCategoryOptions(matchesBeforeCategoryFilter) {
    const select = document.getElementById("category-filter");
    const wrap = document.getElementById("category-filter-wrap");

    const counts = {};
    matchesBeforeCategoryFilter.forEach(p => {
        if (!p.category_l1) return;
        counts[p.category_l1] = (counts[p.category_l1] || 0) + 1;
    });
    const categories = Object.keys(counts).sort();

    select.innerHTML = '<option value="all">All categories</option>' +
        categories.map(c => `<option value="${escapeAttr(c)}">${escapeHtml(c)} (${counts[c]})</option>`).join("");

    if (activeCategory !== "all" && !categories.includes(activeCategory)) {
        activeCategory = "all";
    }
    select.value = activeCategory;
    wrap.style.display = categories.length > 0 ? "block" : "none";
}

function runSearch() {
    if (!fuse) return;
    const term = document.getElementById("search").value.trim();
    const startHint = document.getElementById("start-hint");
    const emptyState = document.getElementById("empty-state");
    const resultsCount = document.getElementById("results-count");
    const resultsWrap = document.getElementById("results");
    const resultsTools = document.getElementById("results-tools");
    const cta = document.getElementById("newcode-cta");
    const footer = document.getElementById("results-footer");

    resultsWrap.innerHTML = "";
    footer.innerHTML = "";
    resultsTools.innerHTML = "";

    if (!term) {
        startHint.style.display = "block";
        emptyState.style.display = "none";
        emptyState.innerHTML = "";
        resultsCount.textContent = "";
        cta.classList.remove("show");
        document.getElementById("category-filter-wrap").style.display = "none";
        return;
    }

    startHint.style.display = "none";
    cta.classList.add("show");

    let rawMatches = fuse.search(term);

    let matches = rawMatches.map(r => {
        const item = { ...r.item, _matches: r.matches };
        return item;
    });

    if (activeVertical !== "all") {
        matches = matches.filter(p => p.vertical === activeVertical);
    }
    if (activeStatus !== "all") {
        matches = matches.filter(p => activeStatus === "active" ? p.active : !p.active);
    }

    updateCategoryOptions(matches);

    if (activeCategory !== "all") {
        matches = matches.filter(p => p.category_l1 === activeCategory);
    }

    currentMatches = matches.slice(0, HARD_CAP);
    displayCount = Math.min(PAGE_SIZE, currentMatches.length);

    if (currentMatches.length === 0) {
        emptyState.style.display = "block";
        emptyState.innerHTML = `
            <p><strong>No matches found.</strong> Check the spelling, or try a shorter/broader term.</p>
            <p style="margin-top:10px;">
                <a href="#" id="report-no-match" style="color:var(--accent); font-size:13px;">Not what you expected? Let us know what you searched</a>
            </p>
        `;
        document.getElementById("report-no-match").addEventListener("click", (e) => {
            e.preventDefault();
            const subject = `[SEARCH - NO MATCH] "${term}"`;
            const body = `Search term with no results: ${term}\n\nVertical filter: ${activeVertical}\nStatus filter: ${activeStatus}\nCategory filter: ${activeCategory}`;
            window.location.href = `mailto:${RECIPIENT}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
        });
        resultsCount.textContent = "";
        return;
    }

    emptyState.style.display = "none";
    emptyState.innerHTML = "";
    renderResultsPage(matches.length);
}

function renderResultsPage(totalMatchCount) {
    const resultsCount = document.getElementById("results-count");
    const resultsWrap = document.getElementById("results");
    const resultsTools = document.getElementById("results-tools");
    const footer = document.getElementById("results-footer");

    resultsCount.textContent = `${totalMatchCount} result${totalMatchCount === 1 ? "" : "s"}` +
        (totalMatchCount > HARD_CAP ? ` (showing first ${HARD_CAP})` : "");

    resultsWrap.innerHTML = "";
    currentMatches.slice(0, displayCount).forEach(p => resultsWrap.appendChild(renderRow(p)));

    resultsTools.innerHTML = "";
    const selectAllLabel = document.createElement("label");
    selectAllLabel.style.cssText = "display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--subtext); cursor:pointer;";
    const visibleCodes = currentMatches.slice(0, displayCount).map(p => p.stock_code);
    const allVisibleSelected = visibleCodes.length > 0 && visibleCodes.every(c => selectedItems.has(c));
    selectAllLabel.innerHTML = `<input type="checkbox" ${allVisibleSelected ? "checked" : ""} style="accent-color:var(--accent);"> Select all visible`;
    selectAllLabel.querySelector("input").addEventListener("change", (e) => {
        currentMatches.slice(0, displayCount).forEach(p => {
            if (e.target.checked) selectedItems.set(p.stock_code, p);
            else selectedItems.delete(p.stock_code);
        });
        updateSelectionBar();
        renderResultsPage(totalMatchCount);
    });
    resultsTools.appendChild(selectAllLabel);

    const exportBtn = document.createElement("button");
    exportBtn.className = "btn";
    exportBtn.style.fontSize = "12.5px";
    exportBtn.style.padding = "5px 10px";
    exportBtn.textContent = "Export to CSV";
    exportBtn.addEventListener("click", () => exportMatchesToCSV());
    resultsTools.appendChild(exportBtn);

    footer.innerHTML = "";
    if (totalMatchCount > HARD_CAP) {
        const msg = document.createElement("p");
        msg.style.cssText = "font-size:13px; color:var(--inactive); margin-top:4px;";
        msg.textContent = `${totalMatchCount} matches is a lot — try narrowing your search for a more useful list.`;
        footer.appendChild(msg);
    } else if (displayCount < currentMatches.length) {
        const btn = document.createElement("button");
        btn.className = "btn";
        btn.textContent = `Show ${Math.min(PAGE_SIZE, currentMatches.length - displayCount)} more`;
        btn.addEventListener("click", () => {
            displayCount = Math.min(displayCount + PAGE_SIZE, currentMatches.length);
            renderResultsPage(totalMatchCount);
        });
        footer.appendChild(btn);
    }
}

function exportMatchesToCSV() {
    const headers = ["Stock Code", "Stock Name", "Vertical", "Category", "Status"];
    const rows = currentMatches.map(p => [
        p.stock_code, p.stock_name, p.vertical, p.category_l1, p.active ? "Active" : "Inactive"
    ]);
    const csvContent = [headers, ...rows]
        .map(row => row.map(val => `"${String(val ?? "").replace(/"/g, '""')}"`).join(","))
        .join("\n");
    const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `stock_search_export_${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
    URL.revokeObjectURL(url);
}

function highlightMatch(text, matches, keyName) {
    if (!text) return "";
    const matchObj = (matches || []).find(m => m.key === keyName);
    if (!matchObj || !matchObj.indices || matchObj.indices.length === 0) return escapeHtml(text);

    let result = "";
    let lastIndex = 0;
    const indices = [...matchObj.indices].sort((a, b) => a[0] - b[0]);
    indices.forEach(([start, end]) => {
        if (start < lastIndex) return;
        result += escapeHtml(text.slice(lastIndex, start));
        result += `<mark style="background:rgba(124,106,247,0.35); color:inherit; border-radius:2px; padding:0 1px;">${escapeHtml(text.slice(start, end + 1))}</mark>`;
        lastIndex = end + 1;
    });
    result += escapeHtml(text.slice(lastIndex));
    return result;
}

function renderRow(p) {
    const row = document.createElement("div");
    row.className = "result-row";
    if (selectedItems.has(p.stock_code)) row.classList.add("selected");

    const catPath = [p.category_l1, p.category_l2].filter(Boolean).join(" › ");
    const nameHtml = highlightMatch(p.stock_name, p._matches, "stock_name");
    const codeHtml = highlightMatch(p.stock_code, p._matches, "stock_code");

    row.innerHTML = `
        <div class="result-left">
            <input type="checkbox" class="result-checkbox" ${selectedItems.has(p.stock_code) ? "checked" : ""}>
            <div class="result-info">
                <div class="result-name">${nameHtml}</div>
                <div class="result-meta">
                    <span class="code-tag" title="Click to copy" style="cursor:pointer;">${codeHtml}</span>
                    <span class="badge ${p.active ? "active" : "inactive"}">${p.active ? "Active" : "Inactive"}</span>
                    <span>${escapeHtml(p.vertical)}</span>
                    ${catPath ? `<span>\u00b7 ${escapeHtml(catPath)}</span>` : ""}
                </div>
            </div>
        </div>
        <div class="result-actions"></div>
    `;

    row.querySelector(".code-tag").addEventListener("click", () => {
        navigator.clipboard.writeText(p.stock_code).then(() => {
            showToast(`Copied ${p.stock_code}`);
        }).catch(() => {
            showToast(`Copy failed — code is ${p.stock_code}`);
        });
    });

    row.querySelector(".result-checkbox").addEventListener("change", (e) => {
        if (e.target.checked) {
            selectedItems.set(p.stock_code, p);
        } else {
            selectedItems.delete(p.stock_code);
        }
        row.classList.toggle("selected", e.target.checked);
        updateSelectionBar();
    });

    const actions = row.querySelector(".result-actions");

    if (!p.active) {
        const btn = document.createElement("button");
        btn.className = "btn primary";
        btn.textContent = "Reactivate this code";
        btn.addEventListener("click", () => openModal("reactivate", p));
        actions.appendChild(btn);
    } else {
        const btn = document.createElement("button");
        btn.className = "btn";
        btn.textContent = "Use as template";
        btn.addEventListener("click", () => openModal("clone", p));
        actions.appendChild(btn);
    }

    return row;
}

function updateSelectionBar() {
    const bar = document.getElementById("selection-bar");
    const count = document.getElementById("sel-count");
    if (selectedItems.size > 0) {
        bar.classList.add("show");
        count.textContent = `${selectedItems.size} selected`;
    } else {
        bar.classList.remove("show");
    }
}

document.getElementById("btn-clear-selection").addEventListener("click", () => {
    selectedItems.clear();
    updateSelectionBar();
    runSearch(); // re-render to uncheck visible rows
});

document.getElementById("btn-request-multiple").addEventListener("click", () => {
    if (selectedItems.size === 0) return;
    openModal("multi", Array.from(selectedItems.values()));
});


function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str == null ? "" : String(str);
    return div.innerHTML;
}

/* ---------- Modal / request forms ---------- */

let currentMultiItems = [];

function openModal(type, product) {

    const commonFields = `

                <label>Contract number <span class="req">*</span></label>

    const commercialFields = `
        <div class="field-row">

            <div class="field">

        <div class="field-row">

    if (type === "multi") {

        const itemRows = currentMultiItems.map((item, i) => `
            <tr>

                <td style="padding:6px 4px;">
                    <select name="item_rate_${i}" required style="width:100%; padding:6px 8px; font-size:13px; border-radius:5px; border:1px solid var(--border); background:var(--bg); color:var(--text);">
                        <option value="">--</option>
                        <option value="Weekly">Weekly</option>
                        <option value="Consumable">Consumable</option>
                    </select>
                </td>
                <td style="padding:6px 0 6px 4px;"><input type="text" name="item_transport_${i}" placeholder="Transport" required style="width:100%; padding:6px 8px; font-size:13px; border-radius:5px; border:1px solid var(--border); background:var(--bg); color:var(--text);"></td>
            </tr>
        `).join("");
        form.innerHTML = `
            <div style="overflow-x:auto; margin-bottom:14px;">
                <table style="border-collapse:collapse; width:100%; min-width:520px;">
                    <thead>
                        <tr style="font-size:11.5px; color:var(--subtext); text-align:left;">
                            <th style="padding:0 8px 6px 0;">Product</th>
                            <th style="padding:0 4px 6px;">Supplier</th>
                            <th style="padding:0 4px 6px;">Cost</th>
                            <th style="padding:0 4px 6px;">Rate structure</th>
                            <th style="padding:0 0 6px 4px;">Transport</th>
                        </tr>
                    </thead>
                    <tbody>${itemRows}</tbody>
                </table>

            <p style="font-size:12px; color:var(--inactive); margin:-8px 0 14px;">* If a rate is daily or something other than Weekly/Consumable, note it in the reason below.</p>

            <div class="field">

                <input type="text" name="stock_name" value="${escapeAttr(product.stock_name)}" readonly>
            </div>

            ${commonFields}
            <div class="field">

    } else if (type === "new") {
        title.textContent = "Request a brand new stock code";
        sub.textContent = "For when nothing in the catalogue is close enough to reuse or clone.";
        form.innerHTML = `
            <div class="field">
                <label>Proposed product description <span class="req">*</span></label>
                <input type="text" name="new_description" required>
            </div>
            <div class="field-row">
                <div class="field">
                    <label>Vertical <span class="req">*</span></label>
                    <input type="text" name="vertical" required>
                </div>
                <div class="field">
                    <label>Category (best guess) <span class="req">*</span></label>
                    <input type="text" name="category" required>
                </div>
            </div>
            <div class="field-row">
                <div class="field">
                    <label>Supplier name <span class="req">*</span></label>
                    <input type="text" name="supplier_name" required>
                </div>
                <div class="field">
                    <label>Bulk load <span class="req">*</span></label>
                    <input type="text" name="bulk_load" required>
                </div>
            </div>
            <div class="field-row">
                <div class="field">
                    <label>SLA (days) <span class="req">*</span></label>
                    <input type="text" name="sla" required>
                </div>
                <div class="field">
                    <label>Cut off time <span class="req">*</span></label>
                    <input type="text" name="cutoff_time" required>
                </div>
            </div>
            <div class="field-row">
                <div class="field">
                    <label>Cost <span class="req">*</span></label>
                    <input type="text" name="cost" required>
                </div>
                <div class="field">
                    <label>Transport cost <span class="req">*</span></label>
                    <input type="text" name="transport_cost" required>
                </div>
            </div>
            <div class="field">
                <label>Rate structure <span class="req">*</span></label>
                <select name="rate_structure" required>
                    <option value="">-- select --</option>
                    <option value="Weekly">Weekly</option>
                    <option value="Consumable">Consumable</option>
                </select>
            </div>
            <p style="font-size:12px; color:var(--inactive); margin:-8px 0 14px;">* If the rate is daily or something other than Weekly/Consumable, note it in the comments below.</p>
            ${commonFields}

                <label>Why doesn't anything existing cover this? <span class="req">*</span></label>

function submitRow() {
    return `
        <div class="modal-actions">
            <button type="button" class="btn" onclick="closeModal()">Cancel</button>
            <button type="submit" class="btn primary">Open email to send</button>
        </div>
    `;
}

function escapeAttr(str) {
    return escapeHtml(str).replace(/"/g, "&quot;");
}

function closeModal() {
    document.getElementById("overlay").classList.remove("show");
}

document.getElementById("overlay").addEventListener("click", (e) => {
    if (e.target.id === "overlay") closeModal();
});

function showDuplicateInterstitial(term, matches, onContinue) {
    const overlay = document.getElementById("overlay");
    const title = document.getElementById("modal-title");
    const sub = document.getElementById("modal-sub");
    const form = document.getElementById("modal-form");

    title.textContent = "Before you continue...";
    sub.textContent = `Here's what we found close to "${term}" — worth a check before creating something new.`;

    const itemsHtml = matches.map(item => `
        <div style="display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--border); gap:10px;">
            <div style="min-width:0;">
                <div style="font-size:14px; font-weight:500;">${escapeHtml(item.stock_name)}</div>
                <div style="font-size:12px; color:var(--subtext); display:flex; gap:6px; align-items:center; margin-top:2px;">
                    <span class="code-tag">${escapeHtml(item.stock_code)}</span>
                    <span class="badge ${item.active ? "active" : "inactive"}">${item.active ? "Active" : "Inactive"}</span>
                </div>
            </div>
            <button class="btn" style="flex-shrink:0;" data-stock-code="${escapeAttr(item.stock_code)}">${item.active ? "Use as template" : "Reactivate this"}</button>
        </div>
    `).join("");

    form.innerHTML = `
        <div style="max-height:280px; overflow-y:auto; margin-bottom:16px;">${itemsHtml}</div>
        <div class="modal-actions" style="justify-content:space-between;">
            <button type="button" class="btn" onclick="closeModal()">Cancel</button>
            <button type="button" class="btn primary" id="btn-continue-new">None of these fit — continue</button>
        </div>
    `;
    form.onsubmit = (e) => e.preventDefault();

    form.querySelectorAll("button[data-stock-code]").forEach(btn => {
        btn.addEventListener("click", () => {
            const item = matches.find(p => p.stock_code === btn.dataset.stockCode);
            closeModal();
            setTimeout(() => openModal(item.active ? "clone" : "reactivate", item), 150);
        });
    });

    document.getElementById("btn-continue-new").addEventListener("click", onContinue);

    overlay.classList.add("show");
}

function showDuplicateCheck() {
    const term = document.getElementById("search").value.trim();
    if (!term || !fuse) {
        openModal("new", {});
        return;
    }
    const topMatches = fuse.search(term).slice(0, 5).map(r => r.item);
    if (topMatches.length === 0) {
        openModal("new", {});
        return;
    }
    showDuplicateInterstitial(term, topMatches, () => openModal("new", {}));
}

document.getElementById("btn-brand-new").addEventListener("click", showDuplicateCheck);

function submitRequest(type, form) {
    const data = Object.fromEntries(new FormData(form).entries());

    // Final check before a "new code" request actually sends — the earlier check only
    // looked at whatever was in the search box when the button was clicked, which could
    // be empty, unrelated, or just a bad search. This re-checks the real description
    // that's about to be submitted, so a dodgy initial search can't slip a duplicate through.
    if (type === "new" && !form.dataset.dupeChecked && data.new_description && fuse) {
        const dupMatches = fuse.search(data.new_description).slice(0, 5).map(r => r.item);
        if (dupMatches.length > 0) {
            showDuplicateInterstitial(data.new_description, dupMatches, () => {
                form.dataset.dupeChecked = "true";
                submitRequest(type, form);
            });
            return;
        }
    }

    let subject, body;

    if (type === "multi") {
        subject = `[STOCK - MULTIPLE] ${currentMultiItems.length} products requested by ${data.requester_name}`;
        const itemLines = currentMultiItems.map((item, i) =>
            `- ${item.stock_code} - ${item.stock_name} (${item.active ? "Use as template" : "Reactivate"})\n` +
            `    Supplier: ${data[`item_supplier_${i}`] || ""} | Cost: ${data[`item_cost_${i}`] || ""} | ` +
            `Rate structure: ${data[`item_rate_${i}`] || ""} | Transport: ${data[`item_transport_${i}`] || ""}`
        ).join("\n");
        const sharedKeys = ["requester_name", "requester_email", "site_postcode", "contract_number", "reason"];
        const otherLines = sharedKeys.map(key => {
            const label = key.replace(/_/g, " ").replace(/\b\w/g, c => c.toUpperCase());
            return `${label}: ${data[key] || ""}`;
        }).join("\n");
        body = `Products requested:\n${itemLines}\n\n${otherLines}`;
    } else {
        const prefixMap = {
            reactivate: `[STOCK - REACTIVATE] ${data.stock_code} - ${data.stock_name}`,
            clone: `[STOCK - CLONE] from ${data.source_stock_code} - ${data.new_description}`,
            new: `[STOCK - NEW] ${data.new_description}`
        };
        const bodyLines = Object.entries(data).map(([key, value]) => {
            const label = key.replace(/_/g, " ").replace(/\b\w/g, c => c.toUpperCase());
            return `${label}: ${value}`;
        });
        subject = prefixMap[type];
        body = bodyLines.join("\n");
    }

    const mailto = `mailto:${RECIPIENT}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    window.location.href = mailto;

    if (type === "multi") {
        selectedItems.clear();
        updateSelectionBar();
        runSearch();
    }

    closeModal();
    showToast("Opening your email client — check the draft and hit send.");
}

function showToast(msg) {
    const toast = document.getElementById("toast");
    toast.textContent = msg;
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 3500);
}

document.getElementById("search").addEventListener("input", debounce(runSearch, 120));

function debounce(fn, ms) {
    let t;
    return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}

loadData();
</script>
